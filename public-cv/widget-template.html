<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#16192a;--muted:#5b6074;--line:#d6d9e2;--bg:#ffffff;--accent:#2c5a7a;--err:#c43c3c}
@media (prefers-color-scheme:dark){:root{--ink:#eceef6;--muted:#a2a7ba;--line:#343a4d;--bg:#191c28;--accent:#8fbad8;--err:#ff7a7a}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Helvetica Neue",Arial,system-ui,sans-serif}
.box{max-width:480px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:19px} p{margin:0;color:var(--muted)}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 160px;font:16px inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);text-transform:uppercase;letter-spacing:.12em}
button{font:600 15px inherit;padding:10px 16px;border-radius:6px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{min-height:1.3em;font-size:14px} .err{color:var(--err)}
a{color:inherit}
</style></head><body><div class="box">
<h2>CV</h2>
<div id="openBox" hidden><p>Download a general CV.</p><p style="margin-top:8px"><button type="button" class="ghost" id="openBtn">Download CV</button></p></div>
<p>Have a code? Enter it to download the CV prepared for you.</p>
<form id="f"><input id="c" autocomplete="off" autocapitalize="characters" placeholder="Code" aria-label="Code" required><button type="submit" id="go">Get CV</button></form>
<div class="msg" id="m" aria-live="polite"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
const API = "__API__";
const $ = id => document.getElementById(id);
function str(x){ return x == null ? '' : String(x); }
function arr(x){ return Array.isArray(x) ? x : []; }
  function x(s){ return str(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function run(t,o){ o=o||{}; return '<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>'+(o.b?'<w:b/>':'')+(o.color?'<w:color w:val="'+o.color+'"/>':'')+'<w:sz w:val="'+(o.sz||21)+'"/></w:rPr><w:t xml:space="preserve">'+x(t)+'</w:t></w:r>'; }
  function para(r,o){ o=o||{}; return '<w:p><w:pPr>'+(o.center?'<w:jc w:val="center"/>':'')+(o.bullet?'<w:ind w:left="360" w:hanging="220"/>':'')+(o.rule?'<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="999999"/></w:pBdr>':'')+'<w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after==null?80:o.after)+'"/></w:pPr>'+r+'</w:p>'; }
  function head(t){ return para(run(t.toUpperCase(),{b:true,sz:20,color:'333333'}),{before:200,after:80,rule:true}); }
  function rl(a,b,c){ return para(run(str(a)+(b?', '+str(b):''),{b:true})+(c?run('    '+str(c),{color:'555555'}):''),{before:100,after:40}); }
  async function buildDocx(cv){
    const b = [];
    b.push(para(run(str(cv.name),{b:true,sz:36}),{center:true,after:40}));
    if (cv.tagline) b.push(para(run(cv.tagline,{sz:22}),{center:true,after:40}));
    if (cv.contact) b.push(para(run(cv.contact,{sz:19,color:'555555'}),{center:true,after:160}));
    if (cv.profile){ b.push(head('Profile')); b.push(para(run(cv.profile))); }
    if (arr(cv.strengths).length){ b.push(head('Core strengths')); b.push(para(run(arr(cv.strengths).map(str).join('   ·   ')))); }
    if (arr(cv.career).length){ b.push(head('Career')); arr(cv.career).forEach(r => { b.push(rl(r.role,r.org,r.dates)); arr(r.bullets).forEach(t => b.push(para(run('•  '+str(t)),{bullet:true,after:40}))); }); }
    if (arr(cv.earlier).length){ b.push(head('Earlier career')); arr(cv.earlier).forEach(r => { b.push(rl(r.role,r.org,r.dates)); if (r.note) b.push(para(run(r.note))); }); }
    if (arr(cv.education).length){ b.push(head('Education')); arr(cv.education).forEach(r => { b.push(rl(r.title,r.org,r.dates)); if (r.note) b.push(para(run(r.note))); }); }
    if (cv.languages || cv.skills){ b.push(head('Languages and skills')); if (cv.languages) b.push(para(run('Languages: ',{b:true})+run(cv.languages))); if (cv.skills) b.push(para(run(cv.skills))); }
    if (cv.interests){ b.push(head('Background and interests')); b.push(para(run(cv.interests))); }
    const doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+b.join('')+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1000" w:right="1000" w:bottom="1000" w:left="1000" w:header="600" w:footer="600" w:gutter="0"/></w:sectPr></w:body></w:document>';
    const zip = new JSZip();
    zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
    zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
    zip.file('word/document.xml', doc);
    return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  }


const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function norm(c){ return str(c).toUpperCase().replace(/[^A-Z0-9]/g,''); }
async function codeId(code){ const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('rundown-cv:' + norm(code))); return Array.from(new Uint8Array(h), b => b.toString(16).padStart(2,'0')).join(''); }
async function open_(blob, code){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(blob.salt), iterations:blob.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  let buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(blob.iv)}, key, b64(blob.ct));
  if (blob.z){ const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')); buf = await new Response(ds).arrayBuffer(); }
  return JSON.parse(new TextDecoder().decode(buf));
}
function info(){ let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e){} return '&ua=' + encodeURIComponent(navigator.userAgent.slice(0,160)) + '&tz=' + encodeURIComponent(tz) + '&lang=' + encodeURIComponent(navigator.language || ''); }
async function getJson(q){ const r = await fetch(API + '?' + q, {cache:'no-store'}); return r.json(); }
function offer(blob, name){
  const m = $('m'); const url = URL.createObjectURL(blob);
  m.className = 'msg'; m.replaceChildren();
  const a = document.createElement('a'); a.href = url; a.download = name; a.textContent = 'Save the CV';
  const o = document.createElement('a'); o.href = url; o.target = '_blank'; o.rel = 'noopener'; o.textContent = 'open it in a new tab';
  m.append(a, document.createTextNode(' or '), o); try { a.click(); } catch(e){}
}
$('f').addEventListener('submit', async e => {
  e.preventDefault(); const m = $('m'); m.className = 'msg'; m.textContent = 'Checking...'; $('go').disabled = true;
  try {
    const code = $('c').value; const res = await getJson('id=' + await codeId(code) + info());
    if (!res.ok) throw new Error('nf');
    const p = await open_(res.blob, code);
    offer(await buildDocx(p.cv), str(p.cv.name) + ' CV.docx');
  } catch(err){ m.className = 'msg err'; m.textContent = 'That code did not work. It may be mistyped or no longer active.'; }
  $('go').disabled = false;
});
getJson('id=open').then(res => {
  if (!res.ok || !res.cv) return;
  $('openBox').hidden = false;
  $('openBtn').addEventListener('click', async () => { getJson('id=open&dl=1' + info()).catch(() => {}); offer(await buildDocx(res.cv), str(res.cv.name) + ' CV.docx'); });
}).catch(() => {});
})();
</script></body></html>
